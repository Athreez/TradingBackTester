underlyings: [NIFTY, SENSEX]
interval: 1minute      # candle interval the strategy runs on
data_start: 2025-04-02 # INDmoney expired contracts start Apr 2025 (SENSEX 1-Apr expiry missing)
capital: 500000

# Special sessions left out of backtests entirely (data stays in the cache). Full-day weekend
# sessions (Sat 20-Jan-2024, Budget days 1-Feb-2025 and 1-Feb-2026) are traded normally.
exclude_dates:
  - 2021-11-04  # Diwali Muhurat trading (18:15-19:15)
  - 2022-10-24  # Diwali Muhurat trading (18:15-19:15)
  - 2023-11-12  # Diwali Muhurat trading (18:15-19:15)
  - 2024-03-02  # NSE disaster-recovery test session, Saturday, closed 12:30 (before exit_time)
  - 2024-05-18  # NSE disaster-recovery test session, Saturday, closed 12:30 (before exit_time)
  - 2024-11-01  # Diwali Muhurat trading (18:00-19:00)
  - 2025-10-21  # Diwali Muhurat trading (13:45-14:45)
  - 2026-11-08  # Diwali Muhurat trading (14:20-15:30)

# Overrides for core/costs.py CostModel. Defaults = INDmoney API option charges (preset: zerodha for Zerodha).
costs:
  slippage: 0.0005

params:
  entry_time: "09:22"
  exit_time: "14:45"
  entry_window_minutes: 5    # skip the day if no candle within 5 min of entry_time (special sessions)
  on_stop_loss: exit_side    # a stopped short exits with its own hedge; the other side keeps running
  # Stop-losses as INDmoney GTT stop-limits: limit 5% above the trigger; a triggered stop still
  # unfilled after 1 minute (price ran past the limit) is replaced by a market buy. type: market = SL-M.
  stop_order:
    type: limit
    limit_buffer_pct: 5
    chase_after_minutes: 1
  skip_expiry_day: false     # expiry days are traded
  max_days_to_expiry: null   # e.g. 1 = trade only on expiry day and the day before (calendar days)
  # India VIX at entry picks the day's stop-loss; VIX in 11..14 -> no trade.
  vix_regimes:
    - {vix_below: 11, stop_loss_pct: 40}
    - {vix_above: 14, stop_loss_pct: 30}
  stop_loss_pct: 30          # only used if vix_regimes is emptied
  vix_min: null
  vix_max: null
  # Each day trades the underlying whose weekly expiry is soonest (ties: first listed). With
  # NIFTY expiring Tue and SENSEX Thu that is NIFTY Mon/Tue/Fri, SENSEX Wed/Thu.
  # Illiquid hedge (any of the 5 bars before entry untraded, or < 500 lots in total) -> nearest
  # round_strike instead (ties: nearer ATM); if that is illiquid too, no trade.
  hedge_liquidity:
    lookback_minutes: 5
    min_lots: 500
  schedule:
    NIFTY:
      hedge_pct: 2.0         # hedges at ATM +/- 2% of spot, rounded to the strike step (50)
      round_strike: 100
      lots: 1
    SENSEX:
      hedge_pct: 2.0         # strike step 100
      round_strike: 500
      lots: 1
