underlyings: [NIFTY, SENSEX]
interval: 1minute      # candle interval the strategy runs on
data_start: 2025-09-01 # NIFTY expiry -> Tue, SENSEX -> Thu from here; earlier data isn't comparable
capital: 500000

# Special sessions left out of backtests entirely (data stays in the cache).
exclude_dates:
  - 2025-10-21  # Diwali Muhurat trading (13:45-14:45)

# Overrides for core/costs.py CostModel. Defaults = Zerodha F&O options charges.
costs:
  slippage: 0.0005

params:
  entry_time: "09:22"
  exit_time: "14:45"
  entry_window_minutes: 5    # skip the day if no candle within 5 min of entry_time (special sessions)
  stop_loss_pct: 50          # per short leg: SL when premium rises 50% above sell price
  on_stop_loss: exit_side    # exit_side: only that side + its hedge exit | exit_all: any SL closes every leg
  skip_expiry_day: true      # no trade on the underlying's own expiry day
  vix_min: null              # trade only if India VIX at entry >= vix_min (null = no limit)
  vix_max: null              # ... and <= vix_max
  schedule:
    NIFTY:
      days: [MON, TUE, FRI]  # Tue is NIFTY expiry -> skipped by skip_expiry_day
      hedge_distance: 400    # buy ATM+400 CE and ATM-400 PE
      lots: 1
    SENSEX:
      days: [WED, THU]       # Thu is SENSEX expiry -> skipped by skip_expiry_day
      hedge_distance: 1000
      lots: 1
