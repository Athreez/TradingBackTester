underlyings: [NIFTY, SENSEX]
interval: 1minute      # candle interval the strategy runs on
data_start: 2025-09-01 # NIFTY expiry -> Tue, SENSEX -> Thu from here; earlier data isn't comparable
capital: 500000

# Overrides for core/costs.py CostModel. Defaults = Zerodha F&O options charges.
costs:
  slippage: 0.0005

params:
  entry_time: "09:22"
  exit_time: "14:45"
  entry_window_minutes: 5    # skip the day if no candle within 5 min of entry_time (special sessions)
  stop_loss_pct: 50          # per short leg: exit when premium rises 50% above sell price
  schedule:
    NIFTY:
      days: [MON, TUE, FRI]
      hedge_distance: 400    # buy ATM+400 CE and ATM-400 PE
      lots: 1
    SENSEX:
      days: [WED, THU]
      hedge_distance: 1000
      lots: 1
