[project]
name = "trading-backtester"
version = "0.1.0"
description = "Backtester, paper trader and live trader for NIFTY / SENSEX weekly options strategies"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "data*", "strategies*", "backtester*", "paper_trader*", "live_trader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
